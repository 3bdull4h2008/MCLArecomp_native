<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://mcla.launcher; img-src 'self' data: https://mcla.launcher; style-src 'self' 'unsafe-inline' https://mcla.launcher; font-src 'self' data: https://mcla.launcher; script-src 'self' 'unsafe-inline' https://mcla.launcher; connect-src 'self' https://mcla.launcher" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Midnight Club: Los Angeles — PC Recomp Launcher</title>
<style>
  @font-face { font-family: 'Rajdhani'; font-weight: 600; font-display: swap; src: url('fonts/rajdhani-600.woff2') format('woff2'); }
  @font-face { font-family: 'Rajdhani'; font-weight: 700; font-display: swap; src: url('fonts/rajdhani-700.woff2') format('woff2'); }
  @font-face { font-family: 'Saira Semi Condensed'; font-weight: 600; font-display: swap; src: url('fonts/saira-600.woff2') format('woff2'); }
  @font-face { font-family: 'Saira Semi Condensed'; font-weight: 700; font-display: swap; src: url('fonts/saira-700.woff2') format('woff2'); }

  @font-face {
    font-family: 'MCLA_HUD_Local';
    src: local('Ooh Bahn'), local('OohBahn-FixedWidth'), local('Bahnschrift'), local('Bahnschrift Bold'), local('DIN Alternate');
    font-weight: 600 700;
  }

  :root {
    --mcla-yellow: #e8de2a;
    --mcla-cyan: #44f6f6;
    --mcla-cyan-bar-top: #40f4f4;
    --mcla-bezel-bg: rgba(36, 40, 44, 0.56);
    --mcla-bezel-border: rgba(216, 222, 226, 0.74);
    --mcla-screen-bg: rgba(6, 8, 10, 0.78);
    --mcla-divider: rgba(58, 66, 72, 0.62);
    --mcla-text: #eff4f6;
    --mcla-text-dim: #9aa4aa;
    --tilt-x: 1.4deg;
    --tilt-y: -5.2deg;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 650px;
    height: 446px;
    overflow: hidden;
    font-family: 'MCLA_HUD_Local', 'Bahnschrift', 'Saira Semi Condensed', 'Rajdhani', 'Liberation Sans Narrow', sans-serif;
    background: radial-gradient(circle at 50% 48%, #1c2226 0%, #101417 58%, #090b0d 100%);
    color: var(--mcla-text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* True transparent window mode: clear BOTH html and body + outer stage + outer drop-shadows */
  html.transparent-window,
  html:has(body.transparent-window),
  body.transparent-window,
  body.transparent-window .launcher-stage {
    background: transparent !important;
    background-image: none !important;
  }

  /* Prevent soft outer shadows from blending into WinForms TransparencyKey=Magenta halos */
  body.transparent-window .bezel-outer {
    box-shadow: none !important;
  }
  body.transparent-window .mcla-logo-dock {
    filter: none !important;
  }

  .launcher-stage {
    perspective: 1200px;
    width: 650px;
    height: 446px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  @keyframes mclaMenuOpen {
    0% {
      opacity: 0;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(-42px) scale(0.92);
    }
    100% {
      opacity: 1;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(0px) scale(1);
    }
  }

  /* 604px assembly fits cleanly inside 650x446 even with 3D tilt & tab-kick */
  .launcher-assembly {
    position: relative;
    width: 604px;
    min-width: 604px;
    max-width: 604px;
    flex-shrink: 0;
    padding-top: 52px;
    transform-style: preserve-3d;
    transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
    animation: mclaMenuOpen 175ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .launcher-assembly.kick-next {
    transform: rotateX(var(--tilt-x)) rotateY(calc(var(--tilt-y) + 1.8deg)) scale(0.992);
  }
  .launcher-assembly.kick-prev {
    transform: rotateX(var(--tilt-x)) rotateY(calc(var(--tilt-y) - 1.8deg)) scale(0.992);
  }

  .mcla-logo-dock {
    position: absolute;
    top: 0px;
    left: 12px;
    width: 50%;
    max-width: 300px;
    z-index: 20;
    pointer-events: none;
    transform: translateZ(12px);
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.72));
  }

  .mcla-logo-dock img {
    display: block;
    width: 100%;
    height: auto;
  }

  .bezel-outer {
    position: relative;
    border-radius: 16px;
    padding: 3px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(220, 226, 230, 0.55);
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.72);
  }

  .bezel-inner {
    position: relative;
    border-radius: 13px;
    background: var(--mcla-bezel-bg);
    border: 1.5px solid var(--mcla-bezel-border);
    padding: 16px 12px 7px 12px;
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }

  /* Draggable top strip for borderless FormBorderStyle=None windows */
  .window-drag-strip {
    position: absolute;
    top: 0;
    left: 0;
    right: 68px;
    height: 24px;
    z-index: 15;
    cursor: move;
    /* host handles drag via dragWindow action; app-region would swallow mousedown */
  }

  .window-controls {
    position: absolute;
    top: 6px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
    -webkit-app-region: no-drag;
  }

  .win-ctrl-btn {
    width: 22px;
    height: 18px;
    border-radius: 4px;
    background: rgba(16, 20, 24, 0.65);
    border: 1px solid rgba(190, 198, 204, 0.45);
    color: #dce4e8;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }

  .win-ctrl-btn:hover {
    background: rgba(34, 148, 134, 0.72);
    border-color: var(--mcla-cyan);
    color: #ffffff;
  }

  .win-ctrl-btn.close-btn:hover {
    background: rgba(185, 42, 48, 0.85);
    border-color: #ff7a80;
    color: #ffffff;
  }

  .hud-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 4px 4px 0 4px;
    gap: 8px;
    position: relative;
    z-index: 18;
  }

  .hud-header .shoulder-btn {
    margin-bottom: 7px;
    -webkit-app-region: no-drag;
  }

  .shoulder-btn {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .shoulder-btn:hover {
    filter: brightness(1.15);
  }

  .tabs-strip {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 5px;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }

  .tab-item {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0px;
    height: 36px;
    margin-bottom: 3px;
    padding: 0 3px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    flex: 0 0 34px;
    overflow: hidden;
    transition:
      flex-grow 210ms cubic-bezier(0.22, 1, 0.36, 1),
      flex-basis 210ms cubic-bezier(0.22, 1, 0.36, 1),
      background-color 180ms ease,
      padding 210ms cubic-bezier(0.22, 1, 0.36, 1),
      gap 210ms ease;
  }

  .tab-item.active {
    flex: 1 1 auto;
    height: 39px;
    margin-bottom: 0;
    gap: 9px;
    background: var(--mcla-screen-bg);
    padding: 0 14px 2px 8px;
  }

  .tab-icon-wrap {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .tab-title {
    color: var(--mcla-yellow);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-width 210ms cubic-bezier(0.22, 1, 0.36, 1), opacity 160ms ease 50ms;
  }

  .tab-item.active .tab-title {
    max-width: 240px;
    opacity: 1;
  }

  /* 268px screen height fits subheader + 6 rows cleanly inside 650x446 */
  .hud-screen {
    position: relative;
    background: var(--mcla-screen-bg);
    border-radius: 0 10px 10px 10px;
    border: none;
    padding: 3px 0 5px 0;
    height: 268px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--mcla-bezel-border) transparent;
}

  .row-highlight-bar {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 34px;
    background: linear-gradient(
      to bottom,
      rgba(32, 182, 192, 0.76) 0%,
      rgba(16, 104, 114, 0.38) 54%,
      rgba(4, 18, 22, 0.08) 100%
    );
    box-shadow: inset 0 2px 0 0 var(--mcla-cyan-bar-top);
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition:
      transform 105ms cubic-bezier(0.22, 1, 0.36, 1),
      height 105ms cubic-bezier(0.22, 1, 0.36, 1),
      opacity 100ms ease;
  }

  .row-highlight-bar.visible {
    opacity: 1;
  }

  .sub-header-bar {
    position: relative;
    z-index: 2;
    padding: 4px 14px 5px 14px;
    border-bottom: 1px solid var(--mcla-divider);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #e8eef2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .sub-header-dim {
    color: var(--mcla-text-dim);
    font-size: 13px;
  }

  @keyframes rowSlideInRight {
    0%   { opacity: 0; transform: translateX(48px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes rowSlideInLeft {
    0%   { opacity: 0; transform: translateX(-48px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes rowExitLeft {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(-44px); }
  }
  @keyframes rowExitRight {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(44px); }
  }

  .menu-row { flex: 0 0 auto;

    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 14px 5px 12px;
    min-height: 34px;
    border-bottom: 1px solid var(--mcla-divider);
    cursor: pointer;
    background: transparent;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    flex-shrink: 0;
  }

  .menu-row:last-child {
    border-bottom: none;
  }

  .menu-row.enter-next {
    animation: rowSlideInRight 160ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(min(var(--row-idx, 0), 5) * 12ms);
  }
  .menu-row.enter-prev {
    animation: rowSlideInLeft 160ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(min(var(--row-idx, 0), 5) * 12ms);
  }
  .hud-screen.exiting-next .menu-row,
  .hud-screen.exiting-next .sub-header-bar {
    animation: rowExitLeft 95ms ease-in forwards;
    animation-delay: 0ms;
  }
  .hud-screen.exiting-prev .menu-row,
  .hud-screen.exiting-prev .sub-header-bar {
    animation: rowExitRight 95ms ease-in forwards;
    animation-delay: 0ms;
  }

  .row-left {
    position: relative;
    display: flex;
    align-items: center;
  }

  .row-arrow {
    position: absolute;
    left: 0;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7.5px solid var(--mcla-cyan);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 90ms ease, transform 95ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }

  .menu-row.is-selected .row-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  .row-label-block {
    display: flex;
    flex-direction: column;
    transform: translateX(0);
    transition: transform 95ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .menu-row.is-selected .row-label-block {
    transform: translateX(16px);
  }

  .row-label {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--mcla-text);
    line-height: 1.08;
    text-transform: uppercase;
    transition: color 90ms ease;
  }

  .menu-row.is-selected .row-label {
    color: var(--mcla-cyan);
  }

  .row-sub-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--mcla-text-dim);
    line-height: 1.1;
    transition: color 90ms ease;
  }

  .menu-row.is-selected .row-sub-label {
    color: #96e4e4;
  }

  .row-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .cycle-arrow {
    background: transparent;
    border: none;
    color: #a8b4ba;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 90ms ease;
  }

  .cycle-val {
    min-width: 112px;
    text-align: center;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #dce4e8;
    text-transform: uppercase;
    transition: color 90ms ease;
  }

  .cycle-val.is-on {
    color: var(--mcla-yellow);
  }

  .text-value {
    width: 180px;
    max-width: 240px;
    background: rgba(8, 12, 15, 0.72);
    border: 1px solid rgba(120, 150, 160, 0.55);
    border-radius: 4px;
    color: #eaf6f7;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 5px 8px;
    outline: none;
    text-transform: uppercase;
  }

  .text-value:focus,
  .menu-row.is-selected .text-value {
    border-color: var(--mcla-cyan);
    color: var(--mcla-cyan);
  }

  .menu-row.is-selected .cycle-val,
  .menu-row.is-selected .cycle-arrow {
    color: var(--mcla-cyan);
  }

  .menu-row.is-disabled {
    opacity: 0.42;
    pointer-events: none;
  }

  .thin-slider-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .thin-slider-pct {
    font-size: 16.5px;
    font-weight: 700;
    color: #dce4e8;
    width: 40px;
    text-align: right;
  }

  .menu-row.is-selected .thin-slider-pct {
    color: var(--mcla-cyan);
  }

  .thin-slider-track {
    position: relative;
    width: 156px;
    height: 14px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .thin-slider-rail {
    width: 100%;
    height: 4px;
    background: #1b2124;
    border-radius: 2px;
    overflow: hidden;
  }

  .thin-slider-fill {
    height: 100%;
    background: var(--mcla-cyan);
    border-radius: 2px;
  }

  .hud-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 6px 2px 6px;
    min-height: 28px;
    transition: opacity 90ms ease;
  }

  .hud-footer.dimmed {
    opacity: 0.35;
  }

  .footer-left,
  .footer-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .footer-prompt {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: #eef3f5;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .footer-prompt:hover {
    color: var(--mcla-cyan);
  }

  .hud-toast {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(8, 12, 16, 0.94);
    border: 1px solid var(--mcla-cyan);
    color: var(--mcla-cyan);
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    z-index: 60;
  }

  .hud-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

.hud-screen::-webkit-scrollbar { width: 6px; }
.hud-screen::-webkit-scrollbar-track { background: transparent; }
.hud-screen::-webkit-scrollbar-thumb { background: var(--mcla-bezel-border); border-radius: 3px; }
.menu-row.key-listening .key-bind { color: var(--mcla-yellow) !important; animation: keyListenPulse 0.8s ease-in-out infinite alternate; }
@keyframes keyListenPulse { from { opacity: 1; } to { opacity: 0.45; } }
</style>
</head>
<body>

<div class="launcher-stage">

function buildDefaultConfig(schema) {
  const cfg = {};
  (schema.tabs || []).forEach(tab => {
    if (!tab.options) return;
    cfg[tab.id] = {};
    tab.options.forEach(opt => { cfg[tab.id][opt.key] = opt.default; });
  });
  return cfg;
}

function buildResolvedValues(schema, cfg) {
  const out = {};
  const cliArgs = [];
  (schema.tabs || []).forEach(tab => {
    (tab.options || []).forEach(opt => {
      if (opt.visible === false || !opt.key) return;
      const rawVal = cfg[tab.id] ? cfg[tab.id][opt.key] : opt.default;
      const mapped = (opt.valueMap && Object.prototype.hasOwnProperty.call(opt.valueMap, rawVal))
        ? opt.valueMap[rawVal]
        : rawVal;
      if (opt.tomlSection) {
        if (!out[opt.tomlSection]) out[opt.tomlSection] = {};
        out[opt.tomlSection][opt.key] = mapped;
      }
      if (opt.key === 'resolution_preset' && typeof mapped === 'string' && mapped.indexOf('x') > 0) {
        const parts = mapped.split('x');
        if (!out['_env']) out['_env'] = {};
        out['_env']['MCLA_WINDOW_W'] = parts[0];
        out['_env']['MCLA_WINDOW_H'] = parts[1];
      }
      if (opt.cliFlag) {
        cliArgs.push(`${opt.cliFlag}=${mapped}`);
      }
    });
  });
  return { toml: out, cliArgs: cliArgs };
}

function resolveIncomingOptionValue(opt, incomingVal) {
  if (incomingVal === undefined || incomingVal === null) return undefined;
  if (opt.type === 'cycle' && Array.isArray(opt.values)) {
    if (opt.values.includes(incomingVal)) return incomingVal;
    if (opt.valueMap) {
      for (const label of Object.keys(opt.valueMap)) {
        if (opt.valueMap[label] === incomingVal || String(opt.valueMap[label]).toLowerCase() === String(incomingVal).toLowerCase()) {
          return label;
        }
      }
    }
    if (opt.values.includes('ON') && opt.values.includes('OFF')) {
      if (incomingVal === true || incomingVal === 1 || incomingVal === '1' || String(incomingVal).toLowerCase() === 'true') return 'ON';
      if (incomingVal === false || incomingVal === 0 || incomingVal === '0' || String(incomingVal).toLowerCase() === 'false') return 'OFF';
    }
  }
  if (opt.type === 'slider') {
    const num = Number(incomingVal);
    if (!Number.isNaN(num)) return Math.max(opt.min, Math.min(opt.max, num));
  }
  return incomingVal;
}

window.MCLALauncherAPI = {
  getSchema: () => activeSchema,
  loadSchema: (newSchema) => {
    activeSchema = JSON.parse(JSON.stringify(newSchema));
    activeConfig = buildDefaultConfig(activeSchema);
    initHeaderTabs();
    renderScreen('none');
  },
  getConfig: () => JSON.parse(JSON.stringify(activeConfig)),
  getResolvedConfig: () => buildResolvedValues(activeSchema, activeConfig),
  /* Game CVar dump (mcla.exe MCLA_DUMP_CVARS): every CVar the static schema does not already show gets a row in an ADVANCED tab, grouped by the game's category. */
  loadCVars: (list) => {
    if (!Array.isArray(list)) return;
    const known = new Set();
    (activeSchema.tabs || []).forEach(t => (t.options || []).forEach(o => known.add(o.key.toLowerCase())));
    const options = [];
    list.forEach(cv => {
      if (!cv || typeof cv.name !== 'string' || known.has(cv.name.toLowerCase())) return;
      const base = { key: cv.name, label: cv.name.toUpperCase(), sub: cv.description || '', visible: true, tomlSection: cv.category || 'MCLA' };
      if (cv.type === 'bool') {
        options.push({ ...base, type: 'cycle', values: ['ON', 'OFF'], valueMap: { ON: 'true', OFF: 'false' }, default: cv.default === 'true' ? 'ON' : 'OFF' });
      } else {
        const num = cv.type === 'int' || cv.type === 'float';
        options.push({ ...base, type: 'text', maxLength: 120, values: [], valueMap: {}, default: num ? Number(cv.default) : cv.default });
      }
    });
    if (!options.length) return;
    const schema = JSON.parse(JSON.stringify(activeSchema));
    const tab = { id: 'advanced', title: 'ADVANCED', icon: 'tuning', visible: true, subHeaderLeft: '< MCLA.TOML // GAME CVARS >', subHeaderRight: 'FROM MCLA.EXE', options };
    schema.tabs = (schema.tabs || []).filter(t => t.id !== 'advanced').concat([tab]);
    const home = schema.tabs.find(t => t.isHome);
    if (home && Array.isArray(home.items) && !home.items.some(i => i.id === 'nav_advanced')) {
      const at = home.items.findIndex(i => i.type === 'action' && i.action === 'exitLauncher');
      home.items.splice(at < 0 ? home.items.length : at, 0, { id: 'nav_advanced', type: 'nav', visible: true, label: 'ADVANCED CVARS', targetTab: 'advanced' });
    }
    const prev = JSON.parse(JSON.stringify(activeConfig));
    activeSchema = schema;
    const freshDefaults = buildDefaultConfig(activeSchema);
    for (const tabId of Object.keys(freshDefaults)) {
      if (!prev[tabId]) prev[tabId] = freshDefaults[tabId];
      else {
        for (const k of Object.keys(freshDefaults[tabId])) {
          if (prev[tabId][k] === undefined) prev[tabId][k] = freshDefaults[tabId][k];
        }
      }
    }
    activeConfig = prev;
    initHeaderTabs();
    renderScreen('none');
  },
  /* Accepts either UI-grouped { display: {...} }, TOML-grouped { graphics: {...}, display: {...} }, or flat { renderer_mode: 'd3d12', ... } */
  loadConfig: (cfg) => {
    if (!cfg || typeof cfg !== 'object') return;
    const findKeyCase = (obj, targetLower) => {
      if (!obj || typeof obj !== 'object') return undefined;
      for (const k of Object.keys(obj)) {
        if (k.toLowerCase() === targetLower) return obj[k];
      }
      return undefined;
    };
    (activeSchema.tabs || []).forEach(tab => {
      if (!tab.options || !activeConfig[tab.id]) return;
      tab.options.forEach(opt => {
        const optLower = opt.key.toLowerCase();
        let candidate;
        if (cfg[tab.id]) candidate = findKeyCase(cfg[tab.id], optLower);
        if (candidate === undefined && opt.tomlSection && cfg[opt.tomlSection]) candidate = findKeyCase(cfg[opt.tomlSection], optLower);
        if (candidate === undefined) candidate = findKeyCase(cfg, optLower);
        const resolvedVal = resolveIncomingOptionValue(opt, candidate);
        if (resolvedVal !== undefined) activeConfig[tab.id][opt.key] = resolvedVal;
      });
    });
    renderScreen('none');
  },
  setOption: (section, key, value) => {
    if (activeConfig[section]) {
      activeConfig[section][key] = value;
      renderScreen('none');
    }
  },
  setInputMode: (mode) => {
    if (activeConfig.controls) activeConfig.controls.prompts = mode;
    renderFooterAndShoulders();
  },
  setDetectedDevice: (dev) => {
    if (dev === 'pc' || dev === 'xbox' || dev === 'ps') {
      detectedDevice = dev;
      renderFooterAndShoulders();
    }
  },
  setTransparent: (enabled) => {
    const on = !!enabled;
    document.documentElement.classList.toggle('transparent-window', on);
    document.body.classList.toggle('transparent-window', on);
  },
  onAction: (fn) => {
    if (typeof fn === 'function') actionListeners.push(fn);
  },
  emitAction: (actionName, payload) => {
    try {
      localStorage.setItem(activeSchema.storageKey, JSON.stringify(activeConfig));
    } catch (e) {}
    const resolved = buildResolvedValues(activeSchema, activeConfig);
    if (window.MCLAHostBridge) {
      window.MCLAHostBridge.dispatch(actionName, activeSchema, activeConfig, resolved);
    } else if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({ action: actionName, payload: payload, extra: resolved });
    }
    actionListeners.forEach(fn => fn(actionName, payload, resolved));
  }
};

let lastGamepadBtnMask = 0;
function detectGamepadModel(idStr) {
  const s = (idStr || '').toLowerCase();
  if (s.includes('playstation') || s.includes('dualsense') || s.includes('dualshock') || s.includes('054c')) return 'ps';
  return 'xbox';
}

function syncConnectedGamepads() {
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  for (let i = 0; i < pads.length; i++) {
    if (pads[i] && pads[i].connected) {
      const m = detectGamepadModel(pads[i].id);
      if (detectedDevice !== m) {
        detectedDevice = m;
        renderFooterAndShoulders();
      }
      return;
    }
  }
}

window.addEventListener('gamepadconnected', (e) => {
  detectedDevice = detectGamepadModel(e.gamepad.id);
  renderFooterAndShoulders();
  showToast('CONTROLLER DETECTED: ' + detectedDevice.toUpperCase());
});

window.addEventListener('gamepaddisconnected', () => {
  detectedDevice = 'pc';
  syncConnectedGamepads();
  renderFooterAndShoulders();
});

function pollGamepadLoop() {
  if (navigator.getGamepads) {
    const pads = navigator.getGamepads();
    for (let i = 0; i < pads.length; i++) {
      const gp = pads[i];
      if (!gp) continue;
      let mask = 0;
      gp.buttons.forEach((b, idx) => { if (b.pressed) mask |= (1 << idx); });
      const activeAxis = gp.axes.some(a => Math.abs(a) > 0.35);
      if ((mask !== 0 || activeAxis) && detectedDevice === 'pc') {
        detectedDevice = detectGamepadModel(gp.id);
        renderFooterAndShoulders();
      }
      const rising = mask & ~lastGamepadBtnMask;
      if (rising & (1 << 4)) prevTab();
      if (rising & (1 << 5)) nextTab();
      if (rising & (1 << 12)) moveSelection(-1);
      if (rising & (1 << 13)) moveSelection(1);
      if (rising & (1 << 0)) activateSelectedRow();
      if ((rising & (1 << 1)) && currentTab !== 'main') switchTab('main', 'prev');
      lastGamepadBtnMask = mask;
      break;
    }
  }
  requestAnimationFrame(pollGamepadLoop);
}
requestAnimationFrame(pollGamepadLoop);

             <line x1="11.5" y1="16.5" x2="24.5" y2="16.5" stroke="${col}" stroke-width="1.9"/>`;

    const btn = document.createElement('button');
    btn.className = 'tab-item' + (tab.id === currentTab ? ' active' : '');
    btn.dataset.tabId = tab.id;
    btn.title = tab.title;
    btn.innerHTML = `<span class="tab-icon-wrap">${makeDashedIconSvg(tab.icon, tab.id === currentTab, 27)}</span><span class="tab-title">${tab.title}</span>`;
    btn.addEventListener('click', () => switchTab(tab.id));
    strip.appendChild(btn);
  });
}

function updateHeaderTabsState() {
  const strip = document.getElementById('tabsStrip');
  strip.querySelectorAll('.tab-item').forEach((btn) => {
    const tId = btn.dataset.tabId;
    const isAct = (tId === currentTab);
    const tabObj = activeSchema.tabs.find(t => t.id === tId);
    btn.classList.toggle('active', isAct);
    btn.querySelector('.tab-icon-wrap').innerHTML = makeDashedIconSvg(tabObj.icon, isAct, isAct ? 28 : 26);
  });
}

const assembly = document.getElementById('launcherAssembly');

document.addEventListener('mousemove', (e) => {
  if (assembly.classList.contains('kick-next') || assembly.classList.contains('kick-prev')) return;
  const nx = (e.clientX / window.innerWidth) - 0.5;
  const ny = (e.clientY / window.innerHeight) - 0.5;
  assembly.style.setProperty('--tilt-x', (1.4 - ny * 2.2).toFixed(2) + 'deg');
  assembly.style.setProperty('--tilt-y', (-5.2 + nx * 3.2).toFixed(2) + 'deg');
});

/* Borderless window dragging contract */
document.getElementById('windowDragStrip').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  window.MCLALauncherAPI.emitAction('dragWindow', { screenX: e.screenX, screenY: e.screenY });
});

function cancelKeyListening() {
  const row = window.__mclaListeningRow;
  if (!row) return;
  row.classList.remove('key-listening');
  const bind = row.querySelector('.key-bind');
  if (bind && window.__mclaListeningTab && window.__mclaListeningKey) {
    bind.textContent = activeConfig[window.__mclaListeningTab][window.__mclaListeningKey];
  }
  window.__mclaListeningRow = null;
}

document.addEventListener('mousedown', (e) => {
  if (window.__mclaListeningRow && !window.__mclaListeningRow.contains(e.target)) cancelKeyListening();
});

function switchTab(nextTabId, direction) {
  if (nextTabId === currentTab || isTransitioning) return;
  cancelKeyListening();
  isTransitioning = true;

  // A delayed highlight from a previous screen can overwrite the new screen's
  // highlight (especially in Controls, where row entry is staggered). Cancel it
  // before changing screens so it cannot land on the replacement rows.
  if (window.__mclaHighlightTimer) {
    clearTimeout(window.__mclaHighlightTimer);
    window.__mclaHighlightTimer = null;
  }

  const visibleTabs = activeSchema.tabs.filter(t => t.visible !== false);
  const curIdx = visibleTabs.findIndex(t => t.id === currentTab);
  const nxtIdx = visibleTabs.findIndex(t => t.id === nextTabId);
  const dir = direction || (nxtIdx > curIdx ? 'next' : 'prev');

  const screenEl = document.getElementById('hudScreen');
  const footerEl = document.getElementById('hudFooter');
  const hlBar = document.getElementById('rowHighlightBar');

  hlBar.classList.remove('visible');
  footerEl.classList.add('dimmed');

  currentTab = nextTabId;
  selectedRowIdx = 0;
  updateHeaderTabsState();

  assembly.classList.add(dir === 'next' ? 'kick-next' : 'kick-prev');
  screenEl.classList.add(dir === 'next' ? 'exiting-next' : 'exiting-prev');

  setTimeout(() => {
    screenEl.classList.remove('exiting-next', 'exiting-prev');
    assembly.classList.remove('kick-next', 'kick-prev');
    renderScreen(dir);
    footerEl.classList.remove('dimmed');
    isTransitioning = false;
  }, 95);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('hudToast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('visible'), 2000);
}

function updateHighlightBar(animate) {
  const screenEl = document.getElementById('hudScreen');
  const hlBar = document.getElementById('rowHighlightBar');
  const rows = Array.from(screenEl.querySelectorAll('.menu-row'));
  if (!rows.length) {
    hlBar.classList.remove('visible');
    return;
  }
  selectedRowIdx = Math.max(0, Math.min(rows.length - 1, selectedRowIdx));
  rows.forEach((r, idx) => r.classList.toggle('is-selected', idx === selectedRowIdx));
  const targetRow = rows[selectedRowIdx];

  if (!animate) hlBar.style.transition = 'none';
  hlBar.style.transform = `translateY(${targetRow.offsetTop}px)`;
  hlBar.style.height = `${targetRow.offsetHeight}px`;
  hlBar.classList.add('visible');
  if (!animate) {
    void hlBar.offsetWidth;
    hlBar.style.transition = '';
  }
}

function moveSelection(delta) {
  const rows = document.getElementById('hudScreen').querySelectorAll('.menu-row');
  if (!rows.length) return;
  selectedRowIdx = (selectedRowIdx + delta + rows.length) % rows.length;
  updateHighlightBar(true);
  const sel = rows[selectedRowIdx];
  if (sel && typeof sel.scrollIntoView === 'function') {
    sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function adjustSelected(delta) {
  const rows = document.getElementById('hudScreen').querySelectorAll('.menu-row');
  const row = rows[selectedRowIdx];
  if (!row) return;
  const tabObj = activeSchema.tabs.find(t => t.id === currentTab) || activeSchema.tabs[0];
  const opt = (tabObj.options || [])[selectedRowIdx];
  if (!opt) return;
  let nextVal;
  if (opt.type === 'cycle' && !String(opt.key).startsWith('mcla_key_')) {
    const values = opt.values || [];
    if (!values.length) return;
    const cur = values.indexOf(activeConfig[tabObj.id][opt.key]);
    nextVal = values[(cur + delta + values.length) % values.length];
  } else if (opt.type === 'slider') {
    const step = Number(opt.step) || 5;
    nextVal = Math.max(opt.min, Math.min(opt.max, Number(activeConfig[tabObj.id][opt.key]) + delta * step));
  } else {
    return;
  }
  activeConfig[tabObj.id][opt.key] = nextVal;
  updateRowValueUI(row, opt, nextVal);
  window.MCLALauncherAPI.emitAction('optionChanged', { tab: tabObj.id, key: opt.key, value: nextVal });
}

function activateSelectedRow() {
  const rows = document.getElementById('hudScreen').querySelectorAll('.menu-row');
  const row = rows[selectedRowIdx];
  if (!row) return;
  const bind = row.querySelector('.key-bind');
  const text = row.querySelector('.text-value');
  if (bind) bind.click(); else if (text) text.focus(); else row.click();
}

function attachRowEvents(row, idx) {
  row.addEventListener('mouseenter', () => {
    if (selectedRowIdx !== idx) {
      selectedRowIdx = idx;
      updateHighlightBar(true);
    }
  });
}

function renderFooterAndShoulders() {
  document.getElementById('btnPrevTab').innerHTML = makePromptIcon('prev');
  document.getElementById('btnNextTab').innerHTML = makePromptIcon('next');
  const footer = document.getElementById('hudFooter');
  const tabObj = activeSchema.tabs.find(t => t.id === currentTab) || activeSchema.tabs[0];
  footer.innerHTML = '';

  if (tabObj.isHome) {
    footer.innerHTML = `
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="footer-prompt" id="btnFootExit">EXIT ${makePromptIcon('back')}</button>
        <button class="footer-prompt" id="btnFootLaunch">ACCEPT ${makePromptIcon('accept')}</button>
      </div>
    `;
    footer.querySelector('#btnFootExit').addEventListener('click', () => {
      window.MCLALauncherAPI.emitAction('exitLauncher', null);
      showToast('EXIT LAUNCHER');
    });
    footer.querySelector('#btnFootLaunch').addEventListener('click', () => {
      window.MCLALauncherAPI.emitAction('launchGame', activeConfig);
      showToast('LAUNCHING MCLA PC RECOMP...');
    });
  } else {
    footer.innerHTML = `
      <div class="footer-left">
        <button class="footer-prompt" id="btnFootDefaults">${makePromptIcon('defaults')} DEFAULTS</button>
      </div>
      <div class="footer-right">
        <button class="footer-prompt" id="btnFootBack">BACK ${makePromptIcon('back')}</button>
        <button class="footer-prompt" id="btnFootApply">APPLY ${makePromptIcon('accept')}</button>
      </div>
    `;
    footer.querySelector('#btnFootDefaults').addEventListener('click', () => {
      const def = buildDefaultConfig(activeSchema);
      activeConfig[tabObj.id] = def[tabObj.id];
      window.MCLALauncherAPI.emitAction('restoreDefaults', { tab: tabObj.id });
      renderScreen('none');
      showToast('RESTORED DEFAULTS');
    });
    footer.querySelector('#btnFootBack').addEventListener('click', () => switchTab('main', 'prev'));
    footer.querySelector('#btnFootApply').addEventListener('click', () => {
      window.MCLALauncherAPI.emitAction('saveConfig', activeConfig);
      showToast('CONFIG SAVED');
      switchTab('main', 'prev');
    });
  }
}

function updateRowValueUI(row, opt, newVal) {
  if (opt.type === 'cycle') {
    const keyBind = row.querySelector('.key-bind');
    if (keyBind) { keyBind.textContent = newVal; }
    const valSpan = row.querySelector('.cycle-val');
    if (valSpan) {
      valSpan.textContent = newVal;
      valSpan.classList.toggle('is-on', newVal === 'ON' || newVal === 'ENABLED');
    }
  } else if (opt.type === 'slider') {
    const pct = Math.round(((newVal - opt.min) / (opt.max - opt.min)) * 100);
    const pctSpan = row.querySelector('.thin-slider-pct');
    const fillEl = row.querySelector('.thin-slider-fill');
    if (pctSpan) pctSpan.textContent = newVal + '%';
    if (fillEl) fillEl.style.width = pct + '%';
  }
}

function renderScreen(animDir) {
  updateHeaderTabsState();
  const screen = document.getElementById('hudScreen');
  const hlBar = document.getElementById('rowHighlightBar');

  Array.from(screen.children).forEach(ch => { if (ch !== hlBar) ch.remove(); });

  const tabObj = activeSchema.tabs.find(t => t.id === currentTab) || activeSchema.tabs[0];
  const animClass = animDir === 'next' ? 'enter-next' : (animDir === 'prev' ? 'enter-prev' : '');

  if (tabObj.isHome) {
    (tabObj.items || []).filter(i => i.visible !== false).forEach((item, idx) => {
      const row = document.createElement('button');
      row.className = 'menu-row' + (animClass ? ' ' + animClass : '');
      row.style.setProperty('--row-idx', idx);
      row.innerHTML = `
        <div class="row-left">
          <span class="row-arrow"></span>
          <div class="row-label-block">
            <span class="row-label">${item.label}</span>
            ${item.sub ? `<span class="row-sub-label">${item.sub}</span>` : ''}
          </div>
        </div>
      `;
      row.addEventListener('click', () => {
        if (item.type === 'nav') switchTab(item.targetTab, 'next');
        else {
          window.MCLALauncherAPI.emitAction(item.action, activeConfig);
          showToast(item.action === 'launchGame' ? 'LAUNCHING MCLA PC RECOMP...' : 'EXIT LAUNCHER');
        }
      });
      attachRowEvents(row, idx);
      screen.appendChild(row);
    });
  } else {
    if (tabObj.subHeaderLeft) {
      const sub = document.createElement('div');
      sub.className = 'sub-header-bar';
      sub.innerHTML = `<span>${tabObj.subHeaderLeft}</span><span class="sub-header-dim">${tabObj.subHeaderRight || ''}</span>`;
      screen.appendChild(sub);
    }
    (tabObj.options || []).filter(o => o.visible !== false).forEach((opt, idx) => {
      const val = activeConfig[tabObj.id][opt.key];
      const row = document.createElement('div');
      row.className = 'menu-row' + (animClass ? ' ' + animClass : '');
      row.style.setProperty('--row-idx', idx);

      if (opt.type === 'text') {
        row.innerHTML = `
          <div class="row-left"><span class="row-arrow"></span><div class="row-label-block"><span class="row-label">${opt.label}</span></div></div>
          <div class="row-right"><input class="text-value" type="text" maxlength="${opt.maxLength || 15}" value="${String(val ?? '').replace(/"/g, '&quot;')}" spellcheck="false" /></div>
        `;
        const input = row.querySelector('.text-value');
        const sanitize = (value) => value.replace(/[^ -~]/g, '').replace(/=/g, '').slice(0, opt.maxLength || 15);
        const commit = () => {
          const clean = sanitize(input.value) || String(opt.default || 'SWA');
          input.value = clean;
          activeConfig[tabObj.id][opt.key] = clean;
          window.MCLALauncherAPI.emitAction('optionChanged', { tab: tabObj.id, key: opt.key, value: clean });
        };
        input.addEventListener('input', () => {
          const clean = sanitize(input.value);
          if (clean !== input.value) input.value = clean;
          activeConfig[tabObj.id][opt.key] = clean;
        });
        input.addEventListener('change', commit);
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
      } else if (opt.type === 'cycle') {
        const isKey = String(opt.key).startsWith('mcla_key_');
        row.innerHTML = `
          <div class="row-left"><span class="row-arrow"></span><div class="row-label-block"><span class="row-label">${opt.label}</span></div></div>
          <div class="row-right">
            ${isKey ? `<button class="key-bind" title="Click then press any supported key; click again to cancel">${val}</button>` : `
            <button class="cycle-arrow" data-dir="-1">&lt;</button>
            <span class="cycle-val ${val === 'ON' || val === 'ENABLED' ? 'is-on' : ''}">${val}</span>
            <button class="cycle-arrow" data-dir="1">&gt;</button>`}
          </div>
        `;
        if (isKey) {
          const bind = row.querySelector('.key-bind');
          bind.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.__mclaListeningRow === row) { cancelKeyListening(); return; }
            cancelKeyListening();
            row.classList.add('key-listening');
            window.__mclaListeningRow = row;
            window.__mclaListeningTab = tabObj.id;
            window.__mclaListeningKey = opt.key;
            bind.textContent = 'PRESS KEY...';
          });
        }
        const cycle = (dir) => {
          const cur = opt.values.indexOf(activeConfig[tabObj.id][opt.key]);
          const nxt = (cur + dir + opt.values.length) % opt.values.length;
          const nv = opt.values[nxt];
          activeConfig[tabObj.id][opt.key] = nv;
          updateRowValueUI(row, opt, nv);
          window.MCLALauncherAPI.emitAction('optionChanged', { tab: tabObj.id, key: opt.key, value: nv });
        };
        row.querySelectorAll('.cycle-arrow').forEach(b => {
          b.addEventListener('click', (e) => { e.stopPropagation(); cycle(parseInt(b.dataset.dir, 10)); });
        });
        if (!isKey) row.addEventListener('click', () => cycle(1));
        // key rows: clicking the row does NOT change the binding; only the bind button does.
      } else if (opt.type === 'slider') {
        const pct = Math.round(((val - opt.min) / (opt.max - opt.min)) * 100);
        row.innerHTML = `
          <div class="row-left"><span class="row-arrow"></span><div class="row-label-block"><span class="row-label">${opt.label}</span></div></div>
          <div class="row-right thin-slider-wrap">
            <span class="thin-slider-pct">${val}%</span>
            <div class="thin-slider-track"><div class="thin-slider-rail"><div class="thin-slider-fill" style="width:${pct}%"></div></div></div>
          </div>
        `;
        const track = row.querySelector('.thin-slider-track');
        track.addEventListener('click', (e) => {
          e.stopPropagation();
          const rect = track.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const step = opt.step || 5;
          const raw = opt.min + ratio * (opt.max - opt.min);
          const nv = Math.round(raw / step) * step;
          activeConfig[tabObj.id][opt.key] = nv;
          updateRowValueUI(row, opt, nv);
          window.MCLALauncherAPI.emitAction('optionChanged', { tab: tabObj.id, key: opt.key, value: nv });
        });
      } else {
        row.innerHTML = `
          <div class="row-left"><span class="row-arrow"></span><div class="row-label-block"><span class="row-label">${opt.label}</span></div></div>
          <div class="row-right"><span class="cycle-val" style="min-width:auto;text-align:right;">${val}</span></div>
        `;
        row.addEventListener('click', () => {
          window.MCLALauncherAPI.emitAction(opt.action || 'rowAction', { tab: tabObj.id, key: opt.key, value: val });
          showToast(`${opt.label}: ${opt.action || 'TRIGGERED'}`);
        });
      }
      attachRowEvents(row, idx);
      screen.appendChild(row);
    });
  }

  if (tabObj.id === 'controls') {
    const visibleOpts = (tabObj.options || []).filter(o => o.visible !== false);
    const psIdx = visibleOpts.findIndex(o => o.key === 'MCLA_BTN_PROMPTS_PS');
    const rows = screen.querySelectorAll('.menu-row');
    if (psIdx >= 0 && rows[psIdx]) {
      const enabled = activeConfig.controls.MCLA_BTN_PROMPTS_FIX === 'ON';
      rows[psIdx].classList.toggle('is-disabled', !enabled);
      rows[psIdx].querySelectorAll('button').forEach(b => b.disabled = !enabled);
    }
  }

  renderFooterAndShoulders();

  if (window.__mclaHighlightTimer) clearTimeout(window.__mclaHighlightTimer);
  if (animDir === 'next' || animDir === 'prev') {
    window.__mclaHighlightTimer = setTimeout(() => {
      window.__mclaHighlightTimer = null;
      updateHighlightBar(false);
    }, 250);
  } else {
    requestAnimationFrame(() => updateHighlightBar(false));
  }
}

function prevTab() {
  const vis = activeSchema.tabs.filter(t => t.visible !== false);
  if (!vis.length) return;
  const i = vis.findIndex(t => t.id === currentTab);
  switchTab(vis[(i - 1 + vis.length) % vis.length].id, 'prev');
}

function nextTab() {
  const vis = activeSchema.tabs.filter(t => t.visible !== false);
  if (!vis.length) return;
  const i = vis.findIndex(t => t.id === currentTab);
  switchTab(vis[(i + 1) % vis.length].id, 'next');
}

document.getElementById('btnPrevTab').addEventListener('click', prevTab);
document.getElementById('btnNextTab').addEventListener('click', nextTab);

function keyNameFromEvent(e) {
  const named = {
    ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
    Enter: 'Return', NumpadEnter: 'Return', Space: 'Space', Escape: 'Escape',
    Backspace: 'Backspace', Tab: 'Tab', ShiftLeft: 'LShift', ShiftRight: 'RShift',
    ControlLeft: 'LCtrl', ControlRight: 'RCtrl', AltLeft: 'LAlt', AltRight: 'RAlt',
    Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown',
    Insert: 'Insert', Delete: 'Delete', Pause: 'Pause'
  };
  if (named[e.code]) return named[e.code];
  if (/^F(?:[1-9]|1[0-2])$/.test(e.code || '')) return e.code;
  if (/^Numpad[0-9]$/.test(e.code || '')) return e.code;
  if (/^Key[A-Z]$/.test(e.code || '')) return e.code.slice(3);
  if (/^Digit[0-9]$/.test(e.code || '')) return e.code.slice(5);
  if (e.key && e.key.length === 1 && /[A-Za-z0-9]/.test(e.key)) return e.key.toUpperCase();
  return null;
}

document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (window.__mclaListeningRow) {
    e.preventDefault(); e.stopPropagation();
    const key = keyNameFromEvent(e);
    if (!key) { showToast('UNSUPPORTED KEY'); return; }
    const row = window.__mclaListeningRow;
    activeConfig[window.__mclaListeningTab][window.__mclaListeningKey] = key;
    row.querySelector('.key-bind').textContent = key;
    row.classList.remove('key-listening');
    window.__mclaListeningRow = null;
    window.MCLALauncherAPI.emitAction('optionChanged', { tab: window.__mclaListeningTab, key: window.__mclaListeningKey, value: key });
    return;
  }
  if (detectedDevice !== 'pc' && (!activeConfig.controls || activeConfig.controls.prompts === 'AUTO DETECT')) {
    detectedDevice = 'pc';
    renderFooterAndShoulders();
  }
  const k = e.key;
  const code = e.code || '';
  const isQ = code === 'KeyQ' || k === 'q' || k === 'Q';
  const isE = code === 'KeyE' || k === 'e' || k === 'E';
  const isW = code === 'KeyW' || k === 'w' || k === 'W';
  const isS = code === 'KeyS' || k === 's' || k === 'S';
  const handled = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Tab',' '];
  if (handled.includes(k) || isQ || isE || isW || isS) { e.preventDefault(); e.stopPropagation(); }
  if (k === 'Tab') { moveSelection(e.shiftKey ? -1 : 1); return; }
  if (isQ && !e.repeat) prevTab();
  if (isE && !e.repeat) nextTab();
  if (k === 'ArrowUp' || isW) moveSelection(-1);
  if (k === 'ArrowDown' || isS) moveSelection(1);
  if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const tabObj = activeSchema.tabs.find(t => t.id === currentTab) || activeSchema.tabs[0];
    if (tabObj.isHome) (k === 'ArrowLeft' ? prevTab() : nextTab());
    else adjustSelected(k === 'ArrowLeft' ? -1 : 1);
  }
  if ((k === 'Enter' || k === ' ') && !e.repeat) activateSelectedRow();
  if (k === 'Escape' && currentTab !== 'main' && !e.repeat) switchTab('main', 'prev');
});

document.getElementById('btnWinMin').addEventListener('click', () => {
  window.MCLALauncherAPI.emitAction('minimizeWindow', null);
  showToast('MINIMIZING LAUNCHER...');
});
document.getElementById('btnWinClose').addEventListener('click', () => {
  window.MCLALauncherAPI.emitAction('exitLauncher', null);
  showToast('CLOSING LAUNCHER...');
});

initHeaderTabs();
syncConnectedGamepads();
renderScreen('none');
document.body.tabIndex = -1;
document.body.focus();
try {
  const wantTab = new URLSearchParams(window.location.search).get('tab');
  if (wantTab && activeSchema.tabs.some(t => t.id === wantTab)) switchTab(wantTab, 'next');
} catch (e) {}

function emitReadyOnce() {
  if (window.__mclaReadySent) return;
  window.__mclaReadySent = true;
  window.MCLALauncherAPI.emitAction('ready', { version: '1.0' });
}

if (window.location.protocol !== 'file:') {
  fetch('./launcher.schema.json')
    .then((r) => (r.ok ? r.json() : null))
    .then((ext) => {
      if (ext && Array.isArray(ext.tabs)) {
        window.MCLALauncherAPI.loadSchema(ext);
        try {
          const saved = localStorage.getItem(ext.storageKey || activeSchema.storageKey);
          if (saved) window.MCLALauncherAPI.loadConfig(JSON.parse(saved));
        } catch (e) {}
        try {
          const wantTab = new URLSearchParams(window.location.search).get('tab');
          if (wantTab && activeSchema.tabs.some(t => t.id === wantTab)) switchTab(wantTab, 'next');
        } catch (e) {}
      }
    })
    .catch(() => {})
    .finally(emitReadyOnce);
} else {
  emitReadyOnce();
}
</script>
